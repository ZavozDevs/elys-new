[project]
name = "elys"
version = "0.1.0"
description = "юзербот для telegram на wzgram"
requires-python = ">=3.11"
dependencies = [
    "wzgram[fast]==3.1.3",
    "aiosqlite>=0.20",
    "qrcode>=7.4",
    "PyYAML>=6",
    "packaging>=24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "import-linter>=2"]

[project.scripts]
elys = "elys.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PERF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # кириллица в строках и комментариях

[tool.importlinter]
root_package = "elys"

[[tool.importlinter.contracts]]
name = "слои"
type = "layers"
layers = [
    "elys.builtin",
    "elys.sdk",
    "elys.core",
    "elys.storage",
]

[[tool.importlinter.contracts]]
name = "builtin только через публичный api"
type = "forbidden"
source_modules = ["elys.builtin"]
forbidden_modules = ["elys.core", "elys.storage", "elys.sdk", "elys.app"]
allow_indirect_imports = true  # через `elys` можно

[[tool.importlinter.contracts]]
name = "оформление не знает о приложении"
type = "forbidden"
source_modules = ["elys.ui", "elys.i18n"]
forbidden_modules = ["elys.core", "elys.sdk", "elys.builtin", "elys.app"]
allow_indirect_imports = true
