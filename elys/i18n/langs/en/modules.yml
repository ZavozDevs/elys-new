loaded: "{e:check} <b>{name} · loaded</b>\n<blockquote>Commands → <code>{p}help {name}</code></blockquote>"
unloaded: "{e:disabled} <b>{name} · disabled</b>\n<blockquote>Settings saved.\nEnable → <code>{p}lm {file}</code></blockquote>"
working: "{e:clock} <i>Loading module…</i>"
failed: "Could not change the module. Details are in elys.log. Check the file and try again; list: {p}lm"
dlm: "{e:module} <b>Add a module</b>\n\n<blockquote><code>{p}dlm --trust</code> — in reply to a .py file\n<code>{p}dlm &lt;link or path&gt; --trust</code> — by address</blockquote>\nReplace &lt;…&gt; with your file address.\n\n{e:warn} A module and its dependencies get full access to the account and the computer.\n<b>Install only trusted code.</b> <code>--trust</code> is your consent, not a safety check."
one_path: "Give one path or link. Put a path with spaces in quotes. Examples: {p}dlm"
reply_file: "Reply to a .py file with {p}dlm --trust or give a link. Examples: {p}dlm"
too_big: "The file is over 2 MB. Ask the author for a small .py module."
one_name: "Give one file name without .py: {p}lm hello"
list: "{e:module} <b>Elys · modules</b>"
builtin: "<b>Built-in · {n}</b>\n{names}"
installed: "<b>Installed · {n}</b>\n{names}"
disabled: "<b>Disabled · {n}</b>\n{names}\nSend a command above to enable it."
hints: "Add → <code>{p}dlm</code>\nCommands → <code>{p}help Ping</code>\nDisable → <code>{p}ulm Hello</code>"
ulm: "Name a module, e.g. {p}ulm Hello. Names: {p}lm"
purge_confirm: "This erases the module settings and data for good. If you are sure: {p}ulm {name} --purge --yes"
purged: "{e:disabled} <b>{name}</b> · disabled\n<blockquote>Settings and data erased for good. The file is kept.\nEnable again → <code>{p}lm {file}</code></blockquote>"
reload: "Name a module: {p}reload Hello. List: {p}lm"
rollback: "Name a module: {p}rollback Hello. List: {p}lm"
