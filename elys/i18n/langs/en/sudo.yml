"about": "Who else may control Elys: roles and rules. Owner only."
"roles": "{e:lock} <b>Roles</b>\n<blockquote>{list}</blockquote>\nAdd → <code>{p}sudo add @user</code>\nRemove → <code>{p}sudo del @user</code>"
"role_line": "{name} (<code>{id}</code>) — {roles}"
"empty": "empty for now"
"sudo_usage": "{e:hint} <b>Roles</b>\n<blockquote><code>{p}sudo add &lt;who&gt; [role]</code> — grant (sudo by default)\n<code>{p}sudo del &lt;who&gt; [role]</code> — revoke\nWho: reply to a message, @username or id.\nsudo — almost everything, support — only {p}ping, {p}help, {p}info.</blockquote>"
"added": "{e:check} <b>Granted</b>\n<blockquote>{name} → <code>{role}</code>\nList → <code>{p}sudo</code></blockquote>"
"removed": "{e:check} <b>Revoked</b>\n<blockquote>{name} → <code>{role}</code>\nList → <code>{p}sudo</code></blockquote>"
"bad_role": "A role is latin letters, digits and _, e.g. sudo, support or friends. Only you have the owner role."
"owner": "The owner can already do everything — pick another person or chat."
"no_subject": "Say who: reply to their message or write @username or id."
"not_found": "Couldn't find {who}. Check the @username or id, or reply to the person's message."
"rules": "{e:lock} <b>Rules</b>\n<blockquote>{list}</blockquote>\nAdd → <code>{p}rules allow @user ping</code>\nDelete → <code>{p}rules del 1</code>"
"rule_line": "{n}. {sign} {name} → {target}"
"allow": "✅"
"deny": "⛔"
"module_target": "module {name}"
"rules_usage": "{e:hint} <b>Rules</b>\n<blockquote><code>{p}rules allow &lt;who&gt; &lt;command or module&gt;</code> — open\n<code>{p}rules deny &lt;who&gt; &lt;command or module&gt;</code> — close\n<code>{p}rules del &lt;number&gt;</code> — delete\nWho: reply to a message, @username, id or here — this whole chat.\nDeny beats allow. Rules never apply to you.</blockquote>"
"rule_added": "{e:check} <b>Rule added</b>\n<blockquote>{sign} {name} → {target}\nList → <code>{p}rules</code></blockquote>"
"rule_removed": "{e:check} <b>Rule deleted</b>\n<blockquote>{name} → {target}\nList → <code>{p}rules</code></blockquote>"
"no_target": "No command or module {name}. List → {p}help"
