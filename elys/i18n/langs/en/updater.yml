"about": "Update Elys from git and restart."
"checking": "{e:clock} <i>Checking for updates…</i>"
"latest": "{e:check} <b>No updates</b>\n<blockquote>Version <code>{version}</code> is the latest.</blockquote>"
"available": "{e:version} <b>Update available</b>\n<blockquote expandable><code>{log}</code></blockquote>\nTap «Update» — Elys restarts by itself."
"install": "Update"
"installing": "{e:clock} <i>Updating…</i>"
"failed": "{e:cross} <b>Failed</b>\n<blockquote expandable><code>{output}</code></blockquote>\nElys keeps the previous version. Fix the cause above and repeat {p}update."
"restarting": "{e:clock} <i>Restarting…</i>"
"updated": "{e:check} <b>Updated</b>\n<blockquote><code>{old}</code> → <code>{new}</code>\nDetails → <code>{p}info</code></blockquote>"
"restarted": "{e:check} <b>Restarted</b>\n<blockquote>Elys is running again.</blockquote>"
