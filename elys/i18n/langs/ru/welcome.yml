text: "🌟 <b>Elys работает!</b>\n\nКоманда — обычное сообщение со знаком в начале. Напиши <code>{p}ping</code> — проверить связь.\n\n<blockquote><code>{p}help</code> — список команд\n<code>{p}config</code> — настройки</blockquote>\n\nКоманды выполняются только из твоих сообщений. Собеседники не могут управлять Elys.\nОтветы и меню видны участникам чата. Для личных команд используй этот чат."
commands: "Список команд"
settings: "Настройки"
