"about": "Кто ещё может управлять Elys: роли и правила. Только для владельца."
"roles": "{e:lock} <b>Роли</b>\n<blockquote>{list}</blockquote>\nДобавить → <code>{p}sudo add @user</code>\nУбрать → <code>{p}sudo del @user</code>"
"role_line": "{name} (<code>{id}</code>) — {roles}"
"empty": "пока пусто"
"sudo_usage": "{e:hint} <b>Роли</b>\n<blockquote><code>{p}sudo add &lt;кто&gt; [роль]</code> — выдать (по умолчанию sudo)\n<code>{p}sudo del &lt;кто&gt; [роль]</code> — забрать\nКто: ответ на сообщение, @username или id.\nsudo — почти всё, support — только {p}ping, {p}help, {p}info.</blockquote>"
"added": "{e:check} <b>Выдано</b>\n<blockquote>{name} → <code>{role}</code>\nСписок → <code>{p}sudo</code></blockquote>"
"removed": "{e:check} <b>Забрано</b>\n<blockquote>{name} → <code>{role}</code>\nСписок → <code>{p}sudo</code></blockquote>"
"bad_role": "Роль — латиница, цифры и _, например sudo, support или friends. Роль owner есть только у тебя."
"owner": "Владелец и так может всё — укажи другого человека или чат."
"no_subject": "Укажи, кого: ответь на его сообщение или напиши @username или id."
"not_found": "Не нашёл {who}. Проверь @username или id, либо ответь на сообщение человека."
"rules": "{e:lock} <b>Правила</b>\n<blockquote>{list}</blockquote>\nДобавить → <code>{p}rules allow @user ping</code>\nУдалить → <code>{p}rules del 1</code>"
"rule_line": "{n}. {sign} {name} → {target}"
"allow": "✅"
"deny": "⛔"
"module_target": "модуль {name}"
"rules_usage": "{e:hint} <b>Правила</b>\n<blockquote><code>{p}rules allow &lt;кто&gt; &lt;команда или модуль&gt;</code> — открыть\n<code>{p}rules deny &lt;кто&gt; &lt;команда или модуль&gt;</code> — закрыть\n<code>{p}rules del &lt;номер&gt;</code> — удалить\nКто: ответ на сообщение, @username, id или here — весь этот чат.\nЗапрет сильнее разрешения. На тебя правила не действуют.</blockquote>"
"rule_added": "{e:check} <b>Правило добавлено</b>\n<blockquote>{sign} {name} → {target}\nСписок → <code>{p}rules</code></blockquote>"
"rule_removed": "{e:check} <b>Правило удалено</b>\n<blockquote>{name} → {target}\nСписок → <code>{p}rules</code></blockquote>"
"no_target": "Нет команды или модуля {name}. Список → {p}help"
