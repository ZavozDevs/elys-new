"about": "Обновление Elys из git и перезапуск."
"checking": "{e:clock} <i>Проверяю обновления…</i>"
"latest": "{e:check} <b>Обновлений нет</b>\n<blockquote>Версия <code>{version}</code> — последняя.</blockquote>"
"available": "{e:version} <b>Есть обновление</b>\n<blockquote expandable><code>{log}</code></blockquote>\nНажми «Обновить» — Elys перезапустится сам."
"install": "Обновить"
"installing": "{e:clock} <i>Обновляю…</i>"
"failed": "{e:cross} <b>Не получилось</b>\n<blockquote expandable><code>{output}</code></blockquote>\nElys работает на прежней версии. Исправь причину выше и повтори {p}update."
"restarting": "{e:clock} <i>Перезапускаю…</i>"
"updated": "{e:check} <b>Обновлено</b>\n<blockquote><code>{old}</code> → <code>{new}</code>\nЧто нового → <code>{p}info</code></blockquote>"
"restarted": "{e:check} <b>Перезапущено</b>\n<blockquote>Elys снова работает.</blockquote>"
